# 个股计划清单：每只标的的情景目标价与价格纪律，来源为 Substack「Zane说美股」。
#
# 字段说明
#   symbol        yfinance 代码（港股如 0100.HK）
#   kind          stock | etf（ETF 通常没有目标价，只有分批区间）
#   tags          分组标签，键名需与 config/categories.yaml 中的维度一致
#   target_year   目标价对应的时点（多数为 2027 年底）
#   targets       bear / base / bull 三档情景目标价，帖子没给就留空
#   ref           帖子写作时的参考价
#   zones         价格区间。买入侧类型：starter 试探/第一档、buy 主要买入、add 加仓、deep 深度加仓（需复核）
#                 卖出侧类型：reassess 重新评估/停止加仓、trim 分批兑现
#                 low / high 为价格边界（含），只有一侧时另一侧留空；size 为该档占专项资金的比例
#   reserve       计划中保留不投入的资金比例与用途
#   guards        执行复核线：触发后暂停自动执行计划
#   conditions    计划成立的前提
#   invalidation  需要下调估值或放弃计划的信号
#   assumptions   估值关键假设
#   quotes        原文摘录
#   posts         来源帖子（最新在前），history 为目标价修订记录
#
# ignored_posts：已阅读但不含个股计划的帖子 slug，避免被标为「待录入」。

ignored_posts: []

