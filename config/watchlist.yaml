    target_year: 2027
    targets: {bear: 550, base: 1600, bull: 2900}
    ref: {price: 1065, date: 2026-10-03}
    summary: 中性1600美元；1000美元附近第一档观察，900—950美元更积极考虑买入。
    zones:
      - {type: starter, low: 950, high: 1000, action: 第一档买入观察位置}
      - {type: buy, low: 900, high: 950, action: 更积极考虑买入（估值折回报告时点再留20%折价≈925）}
      - {type: reassess, low: 1300, high: 1400, action: 盈利预测未同步上调时，重新评估继续持有的回报空间}
      - {type: trim, low: 1500, high: 1800, action: 临近2027年底且大体兑现中性假设时的兑现观察区间}
    conditions:
      - 后续财报没有明显改变经营预期；出货、价格和盈利指引基本稳定
      - 暂不写死具体加仓比例，同一价格因不同原因下跌，决策不同
    invalidation:
      - 回调伴随订单减少、价格走弱和盈利下修，需先重算，不能拿旧目标价解释新的低股价
      - 收入和利润率一起明显回落，估值随之下调
    assumptions:
      - 中性：FY2027收入约2730亿美元、FY2028约3170亿美元；毛利率由87%降至80%再降至70%
      - 经营利润法中性约1623美元，自由现金流法约1333美元；按12%要求回报折回≈1157美元
    quotes:
      - 假设后续财报没有明显改变经营预期，我会把1000美元附近作为第一档买入观察位置，900—950美元作为更积极考虑的位置。
      - 至于接近2900美元的乐观估值……我会保留这个情景，但不会用它安排主要的买入计划。
    posts:
      - {slug: mu1600950, date: 2026-10-03, title: 美光MU估值：我算到1600美元，想买在950美元}
    history: []

