name: 更新数据并发布

on:
  schedule:
    - cron: "30 10 * * 1-5"   # 北京时间 18:30，A股收盘后
    - cron: "30 12 * * 1-5"   # 北京时间 20:30，A股补跑（数据源延迟时）
    - cron: "30 22 * * 1-5"   # 北京时间次日 06:30，美股收盘后
    - cron: "30 0 * * 2-6"    # 北京时间次日 08:30，美股补跑
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "pipeline/**", "config/**", "requirements.txt", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 抓取数据并计算
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TZ: Asia/Shanghai
        run: python -W ignore -m pipeline.build

      - name: 保存数据缓存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache data/substack site/data
          git diff --cached --quiet || (git commit -m "data: 自动更新 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')" && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
